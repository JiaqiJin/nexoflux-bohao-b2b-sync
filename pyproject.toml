[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexoflux-bohao-sync"
version = "0.1.5"
description = "Bridge independiente entre Bohao local y Nexoflux B2B"
requires-python = ">=3.12"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "httpx==0.28.1", "PyMySQL==1.2.3", "pywin32==312; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "pyinstaller==6.22.3"]

[project.scripts]
bohao-sync = "bridge.__main__:main"

[tool.setuptools.package-data]
bridge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
